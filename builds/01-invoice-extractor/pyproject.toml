[project]
name = "invoice-extractor"
version = "0.1.0"
description = "PDF invoice -> validated JSON -> spreadsheet row. Standalone twin of the n8n workflow."
requires-python = ">=3.11"
dependencies = ["pypdf>=5", "anthropic>=1.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["extractor", "tests"]
