[project]
name = "inbox-triage"
version = "0.1.0"
description = "Classify inbound email, draft safe replies, build a daily digest. Standalone twin of the n8n Gmail workflow."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["triage", "tests"]
