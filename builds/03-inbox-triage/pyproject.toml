[project]
name = "inbox-triage"
version = "0.1.0"
description = "Classify inbound email, draft safe replies, build a daily digest. Standalone twin of the n8n Gmail workflow."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
