[project]
name = "lead-scout"
version = "0.1.0"
description = "Company URLs -> scraped summary, ICP fit score, opener -> CSV + HubSpot. Standalone twin of the n8n workflow."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "anthropic>=1.0", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
