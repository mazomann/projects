[project]
name = "automations-db"
version = "0.1.0"
description = "Root tooling: database migrations and seed for the automation portfolio."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
# Only the published paths, so `uv run mypy` works in the public mirror too.
# Private paths are type-checked with explicit arguments by .claude/hooks/run-tests.py.
files = ["db", "n8n"]
